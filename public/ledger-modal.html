<div class="modal fade" id="ledgerModal" tabindex="-1" role="dialog" aria-labelledby="ledgerModalLabel" aria-hidden="true">
    <div class="modal-dialog" role="document">
        <div class="modal-content">
            <div class="modal-header">
                <h5 class="modal-title" id="ledgerModalLabel">Envelope Ledger</h5>
                <button type="button" class="close" data-dismiss="modal" aria-label="Close">
                    <span aria-hidden="true">&times;</span>
                </button>
            </div>
            <div class="modal-body">
                <ul id="ledger-modal-list" class="list-group ledger-modal-list"></ul>
                <!-- Edit Ledger Modal (hidden by default) -->
                <div id="edit-ledger-modal" style="margin-top:20px; background:#f8f9fa; border:2px solid #007bff; border-radius:8px; padding:16px;">
                    <h6>Edit Transaction</h6>
                    <form id="edit-ledger-form">
                        <input type="hidden" id="edit-ledger-id">
                        <input type="hidden" id="edit-ledger-envelope-id">
                        <div class="form-group">
                            <label for="edit-ledger-amount">Amount</label>
                            <input type="number" step="0.01" class="form-control" id="edit-ledger-amount" required>
                        </div>
                        <div class="form-group">
                            <label for="edit-ledger-type">Type</label>
                            <input type="text" class="form-control" id="edit-ledger-type" required>
                        </div>
                        <div class="form-group">
                            <label for="edit-ledger-description">Description</label>
                            <input type="text" class="form-control" id="edit-ledger-description">
                        </div>
                        <button type="submit" class="btn btn-primary">Save</button>
                        <button type="button" class="btn btn-secondary" id="edit-ledger-cancel">Cancel</button>
                        <button type="button" class="btn btn-danger" id="delete-ledger-button">Delete</button>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>
